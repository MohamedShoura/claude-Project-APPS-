name: Deploy Dar Al Hikmah Trading Website

on:
  push:
    branches:
      - claude/sharp-heisenberg-oY77g
    paths:
      - 'dar-al-hikmah-trading/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dar-al-hikmah-trading/package-lock.json

      - name: Install dependencies
        working-directory: dar-al-hikmah-trading
        run: npm ci

      - name: Build
        working-directory: dar-al-hikmah-trading
        run: npm run build
        env:
          VITE_BASE_URL: /claude-Project-APPS-/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dar-al-hikmah-trading/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
