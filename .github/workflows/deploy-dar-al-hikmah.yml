name: Deploy Dar Al Hikmah Trading Website

on:
  push:
    branches:
      - claude/sharp-heisenberg-oY77g
    paths:
      - 'dar-al-hikmah-trading/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dar-al-hikmah-trading/package-lock.json

      - name: Install dependencies
        working-directory: dar-al-hikmah-trading
        run: npm ci

      - name: Build
        working-directory: dar-al-hikmah-trading
        run: npm run build
        env:
          VITE_BASE_URL: /claude-Project-APPS-/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dar-al-hikmah-trading/dist
          publish_branch: gh-pages
          force_orphan: true
