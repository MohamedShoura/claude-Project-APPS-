<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بالقيم نرتقي.. وبالحركة نتميز</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
// Boot: load config, fonts and poster, then expose renderFrame(t) for the renderer / preview.
window.ready = (async () => {
  window.CFG = await (await fetch('../config/config.json', { cache: 'no-store' })).json();
  const img = new Image(); img.src = '../' + CFG.poster.src; await img.decode();
  const fams = [CFG.fonts.heading, CFG.fonts.body];
  await Promise.all(['400', '500', '600', '700', '800'].flatMap(w => fams.map(f => document.fonts.load(`${w} 40px ${f}`, 'عربي abc'))));
  await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  if (q.has('cover')) { Engine.init(); buildCover(document.getElementById('stage')); return { total: 0 }; }
  Engine.init();
  window.renderFrame = t => Engine.render(t);
  const t0 = parseFloat(q.get('t') || '0');
  Engine.render(t0);
  if (q.has('play')) { const s = performance.now() - t0 * 1000; const loop = () => { Engine.render(((performance.now() - s) / 1000) % Engine.total); requestAnimationFrame(loop); }; loop(); }
  return { total: Engine.total };
})();
</script>
</body>
</html>
